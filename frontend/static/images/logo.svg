<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="logoBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#031b38" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="60" cy="60" r="56" fill="url(#logoBgGlow)"/>
  
  <!-- Outer Ring with Subtle Tech Dash -->
  <circle cx="60" cy="60" r="48" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4 3"/>
  <circle cx="60" cy="60" r="44" stroke="#0284c7" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Water Droplet Base -->
  <path d="M60 20 C60 20 32 50 32 70 A28 28 0 0 0 88 70 C88 50 60 20 60 20 Z" 
        fill="url(#dropGrad)" filter="url(#cyanGlow)" stroke="#7dd3fc" stroke-width="1.5"/>

  <!-- City Skyline Inside Droplet -->
  <g fill="#0c2340" opacity="0.95">
    <!-- Building 1 Left -->
    <rect x="42" y="58" width="7" height="24" rx="1"/>
    <rect x="44" y="61" width="1.5" height="2" fill="#7dd3fc" opacity="0.8"/>
    <rect x="44" y="65" width="1.5" height="2" fill="#7dd3fc" opacity="0.8"/>
    <rect x="44" y="69" width="1.5" height="2" fill="#7dd3fc" opacity="0.8"/>
    
    <!-- Building 2 Mid-Left Tall -->
    <rect x="50" y="46" width="9" height="36" rx="1"/>
    <rect x="52" y="50" width="2" height="2.5" fill="#38bdf8"/>
    <rect x="55.5" y="50" width="2" height="2.5" fill="#38bdf8"/>
    <rect x="52" y="55" width="2" height="2.5" fill="#38bdf8"/>
    <rect x="55.5" y="55" width="2" height="2.5" fill="#38bdf8"/>
    <rect x="52" y="60" width="2" height="2.5" fill="#38bdf8"/>
    <rect x="55.5" y="60" width="2" height="2.5" fill="#38bdf8"/>
    <!-- Antenna Tower -->
    <line x1="54.5" y1="46" x2="54.5" y2="40" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="54.5" cy="39" r="1.5" fill="#00f0ff"/>

    <!-- Building 3 Center Spire -->
    <rect x="60" y="42" width="10" height="40" rx="1"/>
    <rect x="62" y="47" width="2.5" height="2.5" fill="#00f5d4"/>
    <rect x="66" y="47" width="2.5" height="2.5" fill="#00f5d4"/>
    <rect x="62" y="52" width="2.5" height="2.5" fill="#00f5d4"/>
    <rect x="66" y="52" width="2.5" height="2.5" fill="#00f5d4"/>
    <rect x="62" y="57" width="2.5" height="2.5" fill="#00f5d4"/>
    <rect x="66" y="57" width="2.5" height="2.5" fill="#00f5d4"/>
    <line x1="65" y1="42" x2="65" y2="34" stroke="#00f5d4" stroke-width="1.8"/>
    <circle cx="65" cy="33" r="1.5" fill="#ffffff"/>

    <!-- Building 4 Right -->
    <rect x="71" y="52" width="8" height="30" rx="1"/>
    <rect x="73" y="56" width="2" height="2" fill="#7dd3fc" opacity="0.8"/>
    <rect x="73" y="60" width="2" height="2" fill="#7dd3fc" opacity="0.8"/>
    <rect x="73" y="64" width="2" height="2" fill="#7dd3fc" opacity="0.8"/>
  </g>

  <!-- Waves at the Bottom of Droplet -->
  <path d="M34 76 Q 42 70, 50 75 T 66 75 T 82 75 T 86 78 C 84 86, 74 94, 60 94 C 46 94, 36 86, 34 76 Z" 
        fill="url(#waveGrad)" opacity="0.85"/>
  <path d="M38 81 C 45 77, 52 82, 60 80 C 68 78, 76 83, 82 81" 
        stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M42 86 C 48 83, 54 87, 60 85 C 66 83, 72 87, 78 85" 
        stroke="#7dd3fc" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Eco Green Leaves at the Base -->
  <path d="M46 92 C 34 92, 28 85, 26 80 C 28 88, 38 97, 50 97 C 54 97, 50 93, 46 92 Z" 
        fill="url(#leafGrad)"/>
  <path d="M74 92 C 86 92, 92 85, 94 80 C 92 88, 82 97, 70 97 C 66 97, 70 93, 74 92 Z" 
        fill="url(#leafGrad)"/>
  <path d="M52 96 C 45 96, 36 93, 30 86 C 36 96, 50 101, 60 101 C 70 101, 84 96, 90 86 C 84 93, 75 96, 68 96 C 63 98, 57 98, 52 96 Z" 
        fill="url(#leafGrad)" opacity="0.95"/>
</svg>

