<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none">
  <defs>
    <linearGradient id="cityGlowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#020817" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#020817" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="swooshGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#00f0ff"/>
      <stop offset="80%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bldgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#02416d"/>
      <stop offset="100%" stop-color="#011b33"/>
    </linearGradient>
    <filter id="waveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="240" height="180" fill="url(#cityGlowGrad)"/>

  <!-- City Skyline High-rises -->
  <g fill="url(#bldgGrad)">
    <!-- Tower 1 -->
    <rect x="15" y="80" width="16" height="60" rx="1"/>
    <!-- Tower 2 -->
    <rect x="35" y="60" width="18" height="80" rx="1"/>
    <!-- Tower 3 Spire (Tallest Center) -->
    <rect x="58" y="40" width="22" height="100" rx="2"/>
    <line x1="69" y1="40" x2="69" y2="25" stroke="#00f0ff" stroke-width="1.8"/>
    <circle cx="69" cy="24" r="1.5" fill="#ffffff"/>
    
    <!-- Tower 4 -->
    <rect x="85" y="70" width="18" height="70" rx="1"/>
    <!-- Tower 5 -->
    <rect x="108" y="52" width="20" height="88" rx="1"/>
    <line x1="118" y1="52" x2="118" y2="38" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Tower 6 -->
    <rect x="133" y="78" width="16" height="62" rx="1"/>
    <!-- Tower 7 -->
    <rect x="154" y="65" width="20" height="75" rx="1"/>
    <!-- Tower 8 -->
    <rect x="179" y="85" width="16" height="55" rx="1"/>
    <!-- Tower 9 -->
    <rect x="200" y="95" width="18" height="45" rx="1"/>
  </g>

  <!-- Illuminated Building Windows (Cyan, Blue, Warm White) -->
  <g fill="#00f0ff" opacity="0.85">
    <rect x="39" y="68" width="3" height="3"/>
    <rect x="45" y="68" width="3" height="3"/>
    <rect x="39" y="76" width="3" height="3"/>
    <rect x="45" y="84" width="3" height="3"/>
    
    <!-- Center Tower Windows -->
    <rect x="62" y="48" width="4" height="4" fill="#ffffff"/>
    <rect x="72" y="48" width="4" height="4" fill="#ffffff"/>
    <rect x="62" y="58" width="4" height="4"/>
    <rect x="72" y="58" width="4" height="4"/>
    <rect x="62" y="68" width="4" height="4"/>
    <rect x="72" y="68" width="4" height="4"/>
    <rect x="62" y="78" width="4" height="4"/>
    <rect x="72" y="78" width="4" height="4"/>
    <rect x="62" y="88" width="4" height="4"/>
    <rect x="72" y="88" width="4" height="4"/>
    <rect x="62" y="98" width="4" height="4"/>
    <rect x="72" y="98" width="4" height="4"/>

    <!-- Right Towers Windows -->
    <rect x="112" y="60" width="3" height="3"/>
    <rect x="120" y="60" width="3" height="3"/>
    <rect x="112" y="70" width="3" height="3"/>
    <rect x="120" y="78" width="3" height="3"/>
    <rect x="112" y="88" width="3" height="3"/>

    <rect x="158" y="74" width="3" height="3"/>
    <rect x="166" y="74" width="3" height="3"/>
    <rect x="158" y="84" width="3" height="3"/>
    <rect x="166" y="92" width="3" height="3"/>
  </g>

  <!-- Water Surface Baseline -->
  <rect x="0" y="140" width="240" height="40" fill="#010d1e"/>
  <!-- Water Reflection Lines -->
  <line x1="30" y1="144" x2="50" y2="144" stroke="#00f0ff" stroke-width="1" opacity="0.6"/>
  <line x1="60" y1="146" x2="80" y2="146" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
  <line x1="55" y1="152" x2="85" y2="152" stroke="#00f0ff" stroke-width="1.2" opacity="0.5"/>
  <line x1="110" y1="145" x2="130" y2="145" stroke="#38bdf8" stroke-width="1.2" opacity="0.7"/>
  <line x1="150" y1="147" x2="175" y2="147" stroke="#00f0ff" stroke-width="1" opacity="0.5"/>
  <line x1="10" y1="155" x2="190" y2="155" stroke="#0284c7" stroke-width="1" opacity="0.4"/>

  <!-- Iconic Curved Blue Swoosh Wave Sweeping Across the Bottom Left -->
  <path d="M -10 130 Q 30 155, 70 160 T 170 158 T 245 145 L 245 185 L -10 185 Z" 
        fill="#0284c7" opacity="0.4"/>
  <path d="M -10 142 C 20 148, 50 168, 90 170 C 130 172, 175 160, 245 145" 
        stroke="url(#swooshGrad)" stroke-width="3" fill="none" filter="url(#waveGlow)"/>
  <path d="M -10 155 C 30 160, 70 175, 120 175 C 160 175, 200 165, 245 152" 
        stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.8" fill="none"/>
</svg>

