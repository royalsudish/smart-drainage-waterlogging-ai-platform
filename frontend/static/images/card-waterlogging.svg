<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <defs>
    <linearGradient id="cloudySky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="wetStreet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="35%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="waterMirror" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Rainy Overcast Sky -->
  <rect width="400" height="260" fill="url(#cloudySky)"/>

  <!-- Background Buildings Silhouette -->
  <rect x="20" y="80" width="45" height="70" fill="#475569"/>
  <rect x="75" y="65" width="55" height="85" fill="#334155"/>
  <rect x="270" y="70" width="50" height="80" fill="#334155"/>
  <rect x="330" y="85" width="45" height="65" fill="#475569"/>

  <!-- Roadside Green Trees with Wet Leaves -->
  <ellipse cx="65" cy="115" rx="25" ry="32" fill="#15803d"/>
  <ellipse cx="60" cy="110" rx="20" ry="25" fill="#16a34a"/>
  <rect x="62" y="140" width="6" height="20" fill="#451a03"/>

  <ellipse cx="335" cy="115" rx="25" ry="32" fill="#15803d"/>
  <ellipse cx="340" cy="110" rx="20" ry="25" fill="#16a34a"/>
  <rect x="332" y="140" width="6" height="20" fill="#451a03"/>

  <!-- Roadway Perspective -->
  <polygon points="120,150 280,150 390,260 10,260" fill="url(#wetStreet)"/>

  <!-- Curbs / Sidewalks -->
  <polygon points="100,150 120,150 10,260 -10,260" fill="#64748b"/>
  <polygon points="280,150 300,150 410,260 390,260" fill="#64748b"/>

  <!-- Distant Cars Stuck in Rain -->
  <!-- Car 1 (Center Left) -->
  <g transform="translate(160, 142)">
    <rect x="0" y="5" width="22" height="10" rx="2" fill="#e2e8f0"/>
    <path d="M 3 5 L 7 0 L 16 0 L 19 5 Z" fill="#0f172a"/>
    <circle cx="4" cy="15" r="3" fill="#0f172a"/>
    <circle cx="18" cy="15" r="3" fill="#0f172a"/>
    <!-- Headlight glow in wet road -->
    <ellipse cx="2" cy="16" rx="3" ry="1.5" fill="#fef08a"/>
    <ellipse cx="20" cy="16" rx="3" ry="1.5" fill="#fef08a"/>
  </g>

  <!-- Car 2 (Center Right) -->
  <g transform="translate(210, 145)">
    <rect x="0" y="6" width="26" height="12" rx="2" fill="#ef4444"/>
    <path d="M 4 6 L 8 0 L 19 0 L 23 6 Z" fill="#1e293b"/>
    <circle cx="5" cy="18" r="3.5" fill="#0f172a"/>
    <circle cx="21" cy="18" r="3.5" fill="#0f172a"/>
    <ellipse cx="2" cy="18" rx="3" ry="1.5" fill="#ef4444"/>
  </g>

  <!-- Deep Standing Water / Flooding Inundation Layer -->
  <polygon points="50,185 350,185 390,260 10,260" fill="url(#waterMirror)"/>

  <!-- Water Surface Reflections of Trees & Streetlights -->
  <path d="M 70 195 Q 120 190, 180 195 T 320 195" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 40 215 Q 150 210, 240 215 T 360 215" stroke="#bae6fd" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75"/>
  <path d="M 20 235 Q 120 230, 220 235 T 380 235" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 60 250 Q 180 245, 300 250" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Water Ripples Around Flood Edge -->
  <ellipse cx="140" cy="225" rx="25" ry="6" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.6"/>
  <ellipse cx="260" cy="235" rx="35" ry="8" stroke="#ffffff" stroke-width="1.8" fill="none" opacity="0.7"/>
  <ellipse cx="200" cy="210" rx="18" ry="4" stroke="#ffffff" stroke-width="1.2" fill="none" opacity="0.5"/>
</svg>

