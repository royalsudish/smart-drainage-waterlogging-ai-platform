<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <defs>
    <radialGradient id="riskBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e3a66"/>
      <stop offset="50%" stop-color="#082242"/>
      <stop offset="100%" stop-color="#031024"/>
    </radialGradient>
    <linearGradient id="triRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3344"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="hazardGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#ef4444" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark Atmospheric Cyan/Navy Card Background -->
  <rect width="400" height="260" fill="url(#riskBg)"/>

  <!-- Tech Radar / HUD Rings in Background -->
  <circle cx="200" cy="130" r="110" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="6 4"/>
  <circle cx="200" cy="130" r="85" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.25"/>
  <circle cx="200" cy="130" r="60" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="3 3"/>

  <!-- Crosshair Guides -->
  <line x1="80" y1="130" x2="320" y2="130" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.15"/>
  <line x1="200" y1="20" x2="200" y2="240" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Warning Aura Halo -->
  <circle cx="200" cy="130" r="75" fill="url(#pulseGlow)"/>

  <!-- 3D Red Hazard Warning Triangle Badge -->
  <!-- Outer soft glow -->
  <polygon points="200,45 285,190 115,190" fill="url(#triRed)" filter="url(#hazardGlow)"/>

  <!-- Main Solid Triangle -->
  <polygon points="200,45 285,190 115,190" fill="url(#triRed)" stroke="#fca5a5" stroke-width="3"/>

  <!-- Inner Darker Bevel for 3D look -->
  <polygon points="200,58 273,184 127,184" fill="#b91c1c" opacity="0.4"/>

  <!-- Top highlight rim -->
  <line x1="200" y1="48" x2="120" y2="186" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Exclamation Mark Inside Triangle -->
  <!-- Upper Bar -->
  <rect x="194" y="90" width="12" height="48" rx="6" fill="#ffffff"/>
  <!-- Lower Dot -->
  <circle cx="200" cy="160" r="7" fill="#ffffff"/>

  <!-- Digital Alert Indicator Dots around -->
  <circle cx="150" cy="65" r="3" fill="#00f0ff" opacity="0.8"/>
  <circle cx="250" cy="65" r="3" fill="#00f0ff" opacity="0.8"/>
  <circle cx="100" cy="195" r="3" fill="#ef4444" opacity="0.9"/>
  <circle cx="300" cy="195" r="3" fill="#ef4444" opacity="0.9"/>
</svg>

